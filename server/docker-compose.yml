# SZU Valley · Docker Compose
# 启动前先构建客户端：cd ../client && npm run build
# Build client first:  cd ../client && npm run build
# 启动: docker compose up -d
# 停止: docker compose down

version: "3.9"

services:
  # ---- Redis (位置缓存 + 在线集合) ----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---- PostgreSQL (玩家资料 + 社交数据持久化) ----
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-szu_valley}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-szu_valley_dev}
      POSTGRES_DB: ${DB_NAME:-szu_valley}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-szu_valley}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---- Node.js 游戏服务器 ----
  server:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      PORT: ${PORT:-3001}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DATABASE_URL: ${DATABASE_URL:-postgresql://szu_valley:szu_valley_dev@postgres:5432/szu_valley}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ---- Nginx (反向代理 + 静态文件) ----
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../client/dist:/usr/share/nginx/html:ro
    depends_on:
      - server

volumes:
  redis_data:
  pg_data:
