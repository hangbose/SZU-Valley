# SZU Valley · Nginx 反向代理配置
# 负责：WebSocket (wss://) 升级 + 静态文件 + 负载均衡预留
# Handles: WebSocket upgrade + static files + load balancing (future)

events {
    worker_connections 1024;
}

http {
    # WebSocket 升级必须的 headers
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream szu_valley_backend {
        server server:3001;
    }

    server {
        listen 80;
        server_name localhost;

        # 客户端静态文件（前端部署时启用）
        # Static files for client (enable when frontend is deployed)
        # root /usr/share/nginx/html;
        # index index.html;

        location / {
            # 默认：全部代理到 Socket.IO 服务器
            # Default: proxy everything to the Socket.IO server
            proxy_pass http://szu_valley_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Socket.IO 长连接超时 · Long-polling timeout
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Socket.IO 专用路径
        location /socket.io/ {
            proxy_pass http://szu_valley_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
