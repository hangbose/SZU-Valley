# SZU Valley · Nginx reverse proxy + static file server
# Serves client/dist/ at /, proxies Socket.IO at /socket.io/
# Used in production Docker deployment (single container).

events {
    worker_connections 1024;
}

http {
    # WebSocket upgrade helper
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream szu_valley_backend {
        server 127.0.0.1:3001;
    }

    server {
        listen 80;
        server_name localhost;

        # ---- Static files (client/dist/) ----
        root /usr/share/nginx/html;
        index index.html;

        # ---- Health check ----
        location /health {
            proxy_pass http://szu_valley_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ---- Socket.IO ----
        location /socket.io/ {
            proxy_pass http://szu_valley_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ---- SPA fallback (everything else → index.html) ----
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
