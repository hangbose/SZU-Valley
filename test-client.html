<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>SZU Valley · A1 服务器测试</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .panel {
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 12px;
      padding: 30px;
      width: 700px;
      max-width: 95vw;
    }
    h1 { text-align: center; color: #e94560; margin-bottom: 5px; }
    .subtitle { text-align: center; color: #888; font-size: 12px; margin-bottom: 20px; }
    .status-bar {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin-bottom: 20px; padding: 10px; background: #0f3460; border-radius: 6px;
    }
    .status-dot { width: 12px; height: 12px; border-radius: 50%; background: #666; }
    .status-dot.online { background: #00ff88; }
    .status-dot.offline { background: #ff4444; }
    .row { display: flex; gap: 10px; margin-bottom: 12px; }
    input {
      flex: 1; padding: 10px; border: 1px solid #0f3460; border-radius: 6px;
      background: #1a1a2e; color: #fff; font-family: inherit; font-size: 14px;
    }
    input:focus { outline: none; border-color: #e94560; }
    button {
      padding: 10px 20px; border: none; border-radius: 6px;
      font-family: inherit; font-size: 14px; cursor: pointer; font-weight: bold;
    }
    .btn-join { background: #00ff88; color: #1a1a2e; }
    .btn-join:hover { opacity: 0.8; }
    .btn-leave { background: #ff4444; color: #fff; }
    .btn-leave:hover { opacity: 0.8; }
    .move-pad {
      display: grid;
      grid-template-columns: 60px 60px 60px;
      grid-template-rows: 60px 60px 60px;
      gap: 4px; justify-content: center; margin: 15px 0;
    }
    .move-pad button {
      width: 60px; height: 60px; font-size: 22px; padding: 0;
      background: #0f3460; color: #fff; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .move-pad button:hover { background: #1a5276; }
    .move-pad .empty { background: transparent; }
    .log-area {
      background: #0a0a1a; border: 1px solid #0f3460; border-radius: 6px;
      height: 200px; overflow-y: auto; padding: 10px;
      font-size: 12px; line-height: 1.6;
    }
    .log-area .log-in { color: #00ff88; }
    .log-area .log-out { color: #ff4444; }
    .log-area .log-info { color: #e9a820; }
    .log-area .log-data { color: #888; }
    .section-title {
      color: #e94560; font-size: 13px; margin: 15px 0 8px;
      border-bottom: 1px solid #0f3460; padding-bottom: 4px;
    }
    .npc-table { width: 100%; margin: 8px 0; border-collapse: collapse; }
    .npc-table td {
      padding: 5px 8px; font-size: 12px; border-bottom: 1px solid #0f3460;
    }
    .npc-table .npc-name { color: #e9a820; }
    .npc-table .npc-pos { color: #888; font-size: 11px; }
    .btn-fly { padding: 4px 10px; font-size: 11px; background: #533483; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    .btn-fly:hover { background: #6a44a0; }
    .btn-talk { padding: 4px 10px; font-size: 11px; background: #e9a820; color: #1a1a2e; border: none; border-radius: 4px; cursor: pointer; }
    .btn-talk:hover { background: #d4941a; }
    .btn-fly-near { padding: 4px 10px; font-size: 11px; background: #00ff88; color: #1a1a2e; border: none; border-radius: 4px; cursor: pointer; }
    .btn-fly-near:hover { background: #00cc6a; }
    .tip { color: #ffaa00; font-size: 10px; margin: 4px 0; }
  </style>
</head>
<body>
<div class="panel">
  <h1>🎮 SZU Valley</h1>
  <div class="subtitle">A1 实时游戏服务器 · 测试面板</div>

  <!-- 连接状态 -->
  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">未连接</span>
    &nbsp;|&nbsp; 在线: <b id="onlineCount">-</b>
    &nbsp;|&nbsp; 状态: <b id="myName">-</b>
  </div>

  <!-- 加入 -->
  <div class="section-title">🚪 加入游戏</div>
  <div class="row">
    <input id="nameInput" placeholder="输入你的名字 (2-12字)" maxlength="12">
    <button class="btn-join" onclick="joinGame()">加入</button>
    <button class="btn-leave" onclick="leaveGame()">离开</button>
  </div>

  <!-- 移动 -->
  <div class="section-title">🎯 移动 (方向键/WASD)</div>
  <div style="text-align:center; color:#888; font-size:11px; margin-bottom:4px;">
    当前坐标: <span id="posDisplay" style="color:#00ff88;">-</span>
  </div>
  <div class="move-pad">
    <div class="empty"></div>
    <button onclick="move('up')">▲</button>
    <div class="empty"></div>
    <button onclick="move('left')">◀</button>
    <div class="empty"></div>
    <button onclick="move('right')">▶</button>
    <div class="empty"></div>
    <button onclick="move('down')">▼</button>
    <div class="empty"></div>
  </div>

  <!-- NPC 列表（硬编码，因为所有 NPC 坐标是固定的） -->
  <div class="section-title">🤖 NPC 列表 · 点 🟢飞到旁边 再点 💬对话</div>
  <div class="tip">⚠️ 你必须站在 NPC 的 3 格以内才能对话！出生点 (25,30)，最近的 NPC 是"门卫大叔"(20,20)。</div>
  <table class="npc-table" id="npcTable">
  </table>

  <!-- 多窗口提示 -->
  <div class="section-title">👥 多窗口测试</div>
  <div style="text-align:center; color:#888; font-size:11px; margin-bottom:8px;">
    开两个浏览器窗口，用不同名字加入 → 互相能看到对方移动
  </div>

  <!-- 日志 -->
  <div class="section-title">📋 服务器消息日志</div>
  <div class="log-area" id="logArea">
    <div class="log-info">等待连接...</div>
  </div>
</div>

<script src="http://localhost:3001/socket.io/socket.io.js"></script>
<script>
// ===================================================
// 全部 NPC 数据（与 server/data/npcs.json 一致）
// ===================================================
const ALL_NPCS = [
  { id: "npc_security",    name: "门卫大叔",     x: 20,  y: 20,  desc: "学校正门保安亭" },
  { id: "npc_freshman",    name: "新生小白",     x: 30,  y: 50,  desc: "迷路了拿着地图转" },
  { id: "npc_librarian",   name: "图书馆管理员", x: 60,  y: 30,  desc: "南馆门口徘徊" },
  { id: "npc_canteen_aunt",name: "食堂阿姨",     x: 50,  y: 75,  desc: "荔园食堂门口" },
  { id: "npc_art_student", name: "写生女孩",     x: 80,  y: 45,  desc: "文山湖边画画" },
  { id: "npc_lawn_poet",   name: "草地诗人",     x: 90,  y: 55,  desc: "文山湖边草地" },
  { id: "npc_coffee_owner",name: "咖啡店老板",   x: 100, y: 70,  desc: "学生活动中心旁" },
  { id: "npc_tree_grandpa",name: "大树下大爷",   x: 70,  y: 100, desc: "荔枝林大树下" },
  { id: "npc_bike_repair", name: "修车师傅",     x: 110, y: 110, desc: "自行车棚旁边" },
  { id: "npc_sci_tech_guy",name: "科技楼学长",   x: 120, y: 40,  desc: "科技楼门口" },
  { id: "npc_gym_coach",   name: "体育馆教练",   x: 140, y: 90,  desc: "体育馆外面" },
  { id: "npc_dorm_cat",    name: "宿舍楼猫",     x: 160, y: 60,  desc: "宿舍楼下晒太阳" },
];

// 渲染 NPC 表格
(function renderNPCs() {
  const tbody = document.getElementById("npcTable");
  ALL_NPCS.forEach(n => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="npc-name">${n.name}</td>
      <td class="npc-pos">(${n.x}, ${n.y}) · ${n.desc}</td>
      <td><button class="btn-fly-near" onclick="flyToNPC('${n.id}')">🟢 飞到旁边</button></td>
      <td><button class="btn-talk" onclick="talkToNPC('${n.id}')">💬 对话</button></td>
    `;
    tbody.appendChild(tr);
  });
})();

// ===================================================
// 连接
// ===================================================
const socket = io("http://localhost:3001");
let myPlayerId = null;
let myX = 0, myY = 0;

function log(msg, cls = "log-info") {
  const area = document.getElementById("logArea");
  const time = new Date().toLocaleTimeString();
  area.innerHTML += `<div class="${cls}">[${time}] ${msg}</div>`;
  area.scrollTop = area.scrollHeight;
}

socket.on("connect", () => {
  document.getElementById("statusDot").className = "status-dot online";
  document.getElementById("statusText").textContent = "已连接";
  log("✅ 已连接到服务器", "log-in");
});

socket.on("disconnect", () => {
  document.getElementById("statusDot").className = "status-dot offline";
  document.getElementById("statusText").textContent = "已断开";
  document.getElementById("onlineCount").textContent = "-";
  document.getElementById("myName").textContent = "-";
  myPlayerId = null;
  log("❌ 断开连接", "log-out");
});

// ===================================================
// 加入
// ===================================================
function joinGame() {
  const name = document.getElementById("nameInput").value.trim();
  if (!name) { alert("请输入名字！"); return; }
  if (name.length < 2 || name.length > 12) { alert("名字需要 2-12 个字符！"); return; }
  socket.emit("player.join", { name: name, avatar: "avatar_01" });
}

socket.on("player.joined", (data) => {
  myPlayerId = data.playerId;
  myX = data.spawn.x;
  myY = data.spawn.y;
  document.getElementById("myName").textContent = "🟢 在线";
  document.getElementById("posDisplay").textContent = `(${myX.toFixed(1)}, ${myY.toFixed(1)})`;
  log(`✅ 加入成功！出生点 (${data.spawn.x}, ${data.spawn.y})`, "log-in");
});

socket.on("zone.players", (data) => {
  document.getElementById("onlineCount").textContent = data.players.length + 1;
  const names = data.players.map(p => p.name + "@(" + p.x.toFixed(0) + "," + p.y.toFixed(0) + ")").join(", ");
  log("📍 附近 " + data.players.length + " 个玩家: " + (names || "(无人)"), "log-data");
});

// 其他人加入附近
socket.on("player.joined", (data) => {
  if (data.id !== myPlayerId) {
    log("👋 " + data.name + " 加入附近 (" + data.x.toFixed(0) + "," + data.y.toFixed(0) + ")", "log-in");
  }
});

// 其他人移动
socket.on("player.moved", (data) => {
  log("🚶 玩家移动 → (" + data.x.toFixed(1) + "," + data.y.toFixed(1) + ") " + data.direction, "log-data");
});

// 其他人离开
socket.on("player.left", (data) => {
  log("👋 玩家离开附近", "log-out");
});

// NPC 对话回复
socket.on("npc.dialogue", (data) => {
  log('💬 ' + data.npcName + ': "' + data.text + '"', "log-in");
});

// 错误
socket.on("error", (data) => {
  log("⚠️ 错误 [" + data.code + "]: " + data.message, "log-out");
});

// ===================================================
// 移动
// ===================================================
function move(dir) {
  if (!myPlayerId) { log("⚠️ 请先加入游戏！", "log-out"); return; }
  const step = 0.5;
  switch (dir) {
    case "up":    myY -= step; break;
    case "down":  myY += step; break;
    case "left":  myX -= step; break;
    case "right": myX += step; break;
  }
  socket.emit("player.move", { x: myX, y: myY, direction: dir, moving: true });
  document.getElementById("posDisplay").textContent = "(" + myX.toFixed(1) + ", " + myY.toFixed(1) + ")";
}

document.addEventListener("keydown", (e) => {
  if (!myPlayerId) return;
  const map = { ArrowUp:"up", ArrowDown:"down", ArrowLeft:"left", ArrowRight:"right", w:"up", s:"down", a:"left", d:"right", W:"up", S:"down", A:"left", D:"right" };
  if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
});

// ===================================================
// 飞到 NPC 旁边（距离 = 1，保证在 3 格以内！）
// ===================================================
function flyToNPC(npcId) {
  if (!myPlayerId) { log("⚠️ 请先加入游戏！", "log-out"); return; }
  const npc = ALL_NPCS.find(n => n.id === npcId);
  if (!npc) return;

  // 飞到 NPC 右侧 1 格
  myX = npc.x + 1;
  myY = npc.y;
  document.getElementById("posDisplay").textContent = "(" + myX.toFixed(1) + ", " + myY.toFixed(1) + ")";
  log("🚀 飞到 " + npc.name + " 旁边 (" + myX.toFixed(0) + "," + myY.toFixed(0) + ")", "log-info");

  // 发送位置更新给服务器
  socket.emit("player.move", { x: myX, y: myY, direction: "down", moving: false });
}

// ===================================================
// NPC 对话
// ===================================================
function talkToNPC(npcId) {
  if (!myPlayerId) { log("⚠️ 请先加入游戏！", "log-out"); return; }
  const npc = ALL_NPCS.find(n => n.id === npcId);
  if (!npc) return;
  const dist = Math.abs(myX - npc.x) + Math.abs(myY - npc.y);
  log("📤 和 " + npc.name + " 对话 (距离=" + dist.toFixed(1) + "格, NPC位置=(" + npc.x + "," + npc.y + "))", "log-info");
  socket.emit("npc.talk", { npcId: npcId });
}

// ===================================================
// 离开
// ===================================================
function leaveGame() {
  if (socket.connected) {
    socket.disconnect();
    log("👋 主动离开", "log-out");
  }
  setTimeout(() => { if (!socket.connected) socket.connect(); }, 500);
}
</script>
</body>
</html>
